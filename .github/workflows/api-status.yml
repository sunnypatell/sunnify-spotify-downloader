# Upstream health for the services Sunnify depends on (Spotify embed pages,
# yt-dlp/YouTube) plus the staleness guards in scripts/check_api_status.py.
#
# This exists because the script it runs sat in the repo for months with
# nothing invoking it: every upstream change it was written to catch was
# instead found by a user opening an issue. Weekly, midweek: monday morning
# already runs codeql and scorecard, and upstream breaks on its own clock.

name: API Status

on:
  schedule:
    - cron: "23 6 * * 4" # weekly on thursday, away from the monday jobs
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe upstream services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # qt6 hard-requires libEGL at import time; the probe imports the app
      - name: Install qt6 runtime libs + ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 ffmpeg

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      # the lock, not req.txt's ranges: shipped binaries are built from this,
      # so anything newer here passes green while released users are broken
      - name: Install the same dependencies the release binaries ship
        run: pip install --require-hashes -r requirements-build.txt

      - name: Probe upstream services
        env:
          QT_QPA_PLATFORM: offscreen  # no display on the runner; the probe never opens a window
        run: python scripts/check_api_status.py

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Upstream probe failed. A critical check regressed:"
          echo "  spotify_embed_api / spotify_unavailable_detection -> Spotify changed its embed pages"
          echo "  youtube_search / youtube_audio_formats / youtube_retry_clients -> yt-dlp or YouTube moved"
          echo "Re-run locally with: python scripts/check_api_status.py"
