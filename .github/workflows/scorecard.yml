# OpenSSF Scorecard: weekly supply-chain posture score -> README badge +
# Security tab. Set-and-forget; treated as a dashboard, not a target.
# publish_results forbids top-level env / workflow-level write perms /
# unapproved actions in this job - keep it minimal.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1" # weekly on monday, after the codeql run
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results (signed via OIDC)
      contents: read         # matches the official template

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
