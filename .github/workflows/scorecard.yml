# OpenSSF Scorecard: weekly supply-chain posture score -> README badge +
# Security tab. Set-and-forget; treated as a dashboard, not a target.
# publish_results forbids top-level env / workflow-level write perms /
# unapproved actions in this job - keep it minimal.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1" # weekly on monday, after the codeql run
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results (signed via OIDC)
      contents: read         # matches the official template

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
